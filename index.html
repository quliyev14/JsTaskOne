<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="div-1">
        <div class="div-2">
            <h1 id="header"></h1>
            <input type="text" id="text-1">
            <button id="clear" onclick="OperationCall(id)">C</button>
            <button id="percent" onclick="OperationCall(id)">%</button>
            <button id="delete" onclick="OperationCall(id)">x</button>
            <button id="slash" onclick="OperationCall(id)">/</button>
            <button id="seven" onclick="DigitCall(id)">7</button>
            <button id="eight" onclick="DigitCall(id)">8</button>
            <button id="nine" onclick="DigitCall(id)">9</button>
            <button id="asterisk" onclick="OperationCall(id)">*</button>
            <button id="four" onclick="DigitCall(id)">4</button>
            <button id="five" onclick="DigitCall(id)">5</button>
            <button id="six" onclick="DigitCall(id)">6</button>
            <button id="minus" onclick="OperationCall(id)">-</button>
            <button id="one" onclick="DigitCall(id)">1</button>
            <button id="two" onclick="DigitCall(id)">2</button>
            <button id="three" onclick="DigitCall(id)">3</button>
            <button id="plus" onclick="OperationCall(id)">+</button>
            <button id="double-zero" onclick="DigitCall(id)">00</button>
            <button id="zero" onclick="DigitCall(id)">0</button>
            <button id="dot" onclick="OperationCall(id)">.</button>
            <button id="equals" onclick="Calc(id)">=</button>
        </div>
    </div>

    <script src="index.js">    

    </script> 
</body>
</html>
